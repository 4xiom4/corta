build:
  maxIssues: 60
  excludeCorrectable: false
  weights:
    complexity: 2
    LongParameterList: 1
    style: 1
    comments: 1

config:
  validation: true
  warningsAsErrors: false
  checkExhaustiveness: false

processors:
  active: true

console-reports:
  active: true
  exclude:
    - 'ProjectStatisticsReport'
    - 'NotificationReport'
    - 'FindingsReport'
    - 'FileBasedFindingsReport'

output-reports:
  active: true

comments:
  active: true

complexity:
  active: true
  ComplexCondition:
    active: true
    threshold: 5
  TooManyFunctions:
    active: false
  LongMethod:
    active: true
    threshold: 80
  LargeClass:
    active: true
    threshold: 600
  CyclomaticComplexMethod:
    active: true
    threshold: 20
    ignoreSingleWhenExpression: true
    ignoreSimpleWhenEntries: true
  LongParameterList:
    active: true
    functionThreshold: 8
    constructorThreshold: 8
    ignoreDefaultParameters: true
    ignoreDataClasses: true
  NestedBlockDepth:
    active: true
    threshold: 4

empty-blocks:
  active: true
  EmptyCatchBlock:
    active: true
    allowedExceptionNameRegex: '_|(ignore|expected).*'

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: true
    exceptionNames:
      - 'Error'
      - 'Exception'
      - 'Throwable'
      - 'RuntimeException'
  SwallowedException:
    active: true
  ReturnFromFinally:
    active: true

performance:
  active: true
  ArrayPrimitive:
    active: true
  SpreadOperator:
    active: true

potential-bugs:
  active: true
  AvoidReferentialEquality:
    active: true
  CastToNullableType:
    active: true
  Deprecation:
    active: true
  ImplicitDefaultLocale:
    active: true
  MissingPackageDeclaration:
    active: true
  UnconditionalJumpStatementInLoop:
    active: true

style:
  active: true
  UnusedImports:
    active: true
  UnusedPrivateMember:
    active: true
    allowedNames: '(_|ignored|expected|serialVersionUID)'
  MagicNumber:
    active: false
  MaxLineLength:
    active: true
    maxLineLength: 140
    excludePackageStatements: true
    excludeImportStatements: true
    excludeCommentStatements: false
  ReturnCount:
    active: true
    max: 4
    excludedFunctions: ['equals', 'onCreate', 'onResume', 'onPause', 'onStart', 'onStop', 'onDestroy', 'getRuleForNumber', 'when']
    excludeLabeled: false
    excludeReturnFromLambda: true
    excludeGuardClauses: true
  WildcardImport:
    active: true
  ForbiddenComment:
    active: true
    comments:
      - reason: 'Use TODO(...) format and link to a ticket'
        value: 'FIXME:'
      - reason: 'Use TODO(...) format and link to a ticket'
        value: 'STOPSHIP:'
  Indentation:
    active: false
    indentSize: 4
  NewLineAtEndOfFile:
    active: true
  ParameterListWrapping:
    active: true
    maxLineLength: 140
  TrailingWhitespace:
    active: true
  UnnecessaryParentheses:
    active: true

naming:
  active: true
  ClassNaming:
    active: true
  FunctionNaming:
    active: true
  PackageNaming:
    active: true
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[A-Z][_A-Z0-9]*'
  VariableNaming:
    active: true
  ConstructorParameterNaming:
    active: true
