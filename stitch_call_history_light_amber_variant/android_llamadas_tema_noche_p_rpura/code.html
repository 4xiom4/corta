<body class="min-h-screen flex flex-col">
<!-- Top App Bar -->
<header class="flex justify-between items-center px-6 py-4 w-full sticky top-0 z-50 glass-header">
<div class="flex items-center gap-4">
<button class="p-2 rounded-full hover:bg-surface-container-highest transition-colors active:scale-95 duration-150">

</button>
<h1 class="font-headline font-bold tracking-[-0.02em] text-on-surface text-xl">Llamadas</h1>
</div>
<div class="flex items-center gap-2">
<button class="p-2 rounded-full hover:bg-surface-container-highest transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined text-primary">search</span>
</button>
<button class="p-2 rounded-full hover:bg-surface-container-highest transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined text-primary">more_vert</span>
</button>
</div>
</header>
<main class="flex-1 px-4 pt-4 pb-32 max-w-lg mx-auto w-full">

<div class="space-y-1">

</div>
<div>

<span>Móvil • Hace 2 min</span>
</div>
</div>
</div>
<button class="p-2 rounded-full text-primary hover:bg-primary-container/20 transition-all">
<span class="material-symbols-outlined">call</span>
</button>
</div>
<!-- Call Item 2 -->
<div class="flex items-center justify-between p-3 rounded-xl hover:bg-surface-container-low transition-colors group">
<div class="flex items-center gap-4">
<div class="relative">
<div class="w-12 h-12 rounded-full bg-tertiary-container flex items-center justify-center text-on-tertiary-container font-bold text-lg ring-2 ring-background">S</div>
</div>
<div>
<p class="font-bold text-on-surface">Sofía Chen</p>
<div class="flex items-center gap-1 text-sm text-outline">
<span class="material-symbols-outlined text-[14px] text-primary">call_received</span>
<span>WhatsApp • Ayer</span>
</div>
</div>
</div>
<button class="p-2 rounded-full text-primary hover:bg-primary-container/20 transition-all">
<span class="material-symbols-outlined">videocam</span>
</button>
</div>
<!-- Call Item 3 -->
<div class="flex items-center justify-between p-3 rounded-xl hover:bg-surface-container-low transition-colors group">

<span class="text-error">Perdida • Lun</span>
</div>
</div>
</div>
<button class="p-2 rounded-full text-primary hover:bg-primary-container/20 transition-all">
<span class="material-symbols-outlined">call</span>
</button>
</div>
</div>
</section>
<!-- Keypad Modal (Integrated Look) -->

<div class="mb-6 text-center">
<input class="bg-transparent border-none text-center text-3xl font-medium text-on-surface placeholder:text-outline/30 focus:ring-0 w-full" placeholder="Ingresa un número" readonly="" type="text"/>
</div>
<div class="grid grid-cols-3 gap-y-4 gap-x-6 justify-items-center">
<!-- Keypad Numbers -->
<button class="keypad-button w-16 h-16 rounded-full bg-surface-container flex flex-col items-center justify-center transition-all duration-200">
<span class="text-2xl font-semibold">1</span>
<span class="text-[10px] text-outline font-bold"></span>
</button>
<button class="keypad-button w-16 h-16 rounded-full bg-surface-container flex flex-col items-center justify-center transition-all duration-200">
<span class="text-2xl font-semibold">2</span>
<span class="text-[10px] text-outline font-bold uppercase">ABC</span>
</button>
<button class="keypad-button w-16 h-16 rounded-full bg-surface-container flex flex-col items-center justify-center transition-all duration-200">
<span class="text-2xl font-semibold">3</span>
<span class="text-[10px] text-outline font-bold uppercase">DEF</span>
</button>
<button class="keypad-button w-16 h-16 rounded-full bg-surface-container flex flex-col items-center justify-center transition-all duration-200">
<span class="text-2xl font-semibold">4</span>
<span class="text-[10px] text-outline font-bold uppercase">GHI</span>
</button>
<button class="keypad-button w-16 h-16 rounded-full bg-surface-container flex flex-col items-center justify-center transition-all duration-200">
<span class="text-2xl font-semibold">5</span>
<span class="text-[10px] text-outline font-bold uppercase">JKL</span>
</button>
<button class="keypad-button w-16 h-16 rounded-full bg-surface-container flex flex-col items-center justify-center transition-all duration-200">
<span class="text-2xl font-semibold">6</span>
<span class="text-[10px] text-outline font-bold uppercase">MNO</span>

<button class="keypad-button w-16 h-16 rounded-full bg-surface-container flex flex-col items-center justify-center transition-all duration-200">

<span class="text-[10px] text-outline font-bold uppercase">PQRS</span>
</button>
<button class="keypad-button w-16 h-16 rounded-full bg-surface-container flex flex-col items-center justify-center transition-all duration-200">

<span class="text-2xl font-semibold">9</span>
<span class="text-[10px] text-outline font-bold uppercase">WXYZ</span>
</button>
<button class="keypad-button w-16 h-16 rounded-full bg-surface-container flex flex-col items-center justify-center transition-all duration-200">
<span class="text-2xl font-semibold leading-none">*</span>

<button class="keypad-button w-16 h-16 rounded-full bg-surface-container flex flex-col items-center justify-center transition-all duration-200">
<span class="text-2xl font-semibold">0</span>
<span class="text-[10px] text-outline font-bold leading-none">+</span>
</button>
<button class="keypad-button w-16 h-16 rounded-full bg-surface-container flex flex-col items-center justify-center transition-all duration-200">
<span class="text-2xl font-semibold leading-none">#</span>
</button>
</div>
<!-- Action Buttons -->
<div class="mt-8 flex items-center justify-center gap-12">
<button class="p-4 rounded-full text-outline hover:bg-surface-container-highest transition-all">
<span class="material-symbols-outlined text-2xl">backspace</span>
</button>
<button class="w-16 h-16 rounded-2xl bg-gradient-to-br from-primary to-primary-dim flex items-center justify-center shadow-lg shadow-primary/20 active:scale-90 transition-transform">
<span class="material-symbols-outlined text-on-primary text-3xl filled-icon">call</span>
</button>
<button class="p-4 rounded-full text-outline hover:bg-surface-container-highest transition-all">
<span class="material-symbols-outlined text-2xl">person_add</span>
</button>
</div>
</section>
</main>

<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-2 h-20 bg-slate-900/85 backdrop-blur-2xl shadow-[0_-4px_24px_rgba(0,0,0,0.04)]">

<span class="material-symbols-outlined mb-1">chat</span>
<span class="font-label text-[10px] font-bold tracking-[0.05em] uppercase">MENSAJES</span>
</div>
<!-- Active Tab: LLAMADAS -->
<div class="flex flex-col items-center justify-center text-blue-300 after:content-['\2022'] after:text-[8px] after:mt-0.5 transition-all cursor-pointer">
